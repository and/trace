<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
    a { color: #2a78d6; } a:hover { color: #1c5cab; }
    .card { background: #ffffff; border-radius: 10px; }
    .rowsep { border-top: 0.5px solid rgba(60,60,67,0.29); }
    .seclabel { font-size: 13px; color: rgba(60,60,67,0.6); padding: 0 0 7px 20px; }
    .field { font-size: 17px; color: #000000; letter-spacing: -0.4px; }
    .stepper {
      display: flex; align-items: center; gap: 6px;
      background: rgba(118,118,128,0.12); border-radius: 7px;
      padding: 6px 11px; font-size: 17px; color: #000000;
      letter-spacing: -0.4px; font-variant-numeric: tabular-nums;
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #1c1c1e; display: flex; flex-direction: column; overflow: hidden;">

  <!-- The presenting screen, scaled back behind the sheet -->
  <div style="height: 64px; flex-shrink: 0; background: #2c2c2e; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 9px;">
    <div style="width: 358px; height: 10px; background: #3a3a3c; border-radius: 10px 10px 0 0;"></div>
  </div>

  <!-- Sheet -->
  <div style="flex-grow: 1; background: #f2f2f7; border-radius: 10px 10px 0 0; display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; justify-content: center; padding-top: 5px; flex-shrink: 0;">
      <div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3);"></div>
    </div>

    <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
      <div style="width: 52px;"></div>
      <div style="font-size: 17px; font-weight: 600; color: #000000; letter-spacing: -0.4px;">Edit</div>
      <div style="width: 52px; text-align: right; font-size: 17px; font-weight: 600; color: #2a78d6; letter-spacing: -0.4px;">Done</div>
    </div>

    <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 14px 16px 0 16px;">

      <div>
        <div class="seclabel">NAME</div>
        <div class="card" style="padding: 12px 16px;">
          <div class="field">Study</div>
        </div>
      </div>

      <div>
        <div class="seclabel">NOTE</div>
        <div class="card" style="padding: 12px 16px; min-height: 62px;">
          <div class="field" style="color: rgba(60,60,67,0.3);">Optional</div>
        </div>
      </div>

      <div>
        <div class="seclabel">TIME</div>
        <div class="card">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; min-height: 44px;">
            <div class="field">Start</div>
            <div style="display: flex; gap: 8px;">
              <div class="stepper">30 Apr 2026</div>
              <div class="stepper">10:00</div>
            </div>
          </div>
          <div class="rowsep" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; min-height: 44px;">
            <div class="field">End</div>
            <div style="display: flex; gap: 8px;">
              <div class="stepper">30 Apr 2026</div>
              <div class="stepper">12:30</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="display: flex; align-items: center; justify-content: center; min-height: 44px;">
        <div style="font-size: 17px; color: #e34948; letter-spacing: -0.4px;">Delete Activity</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
